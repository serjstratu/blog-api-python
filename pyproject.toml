[project]
name = "blog-api-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sserj", email = "serj.stratu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
blog-api-python = "blog_api_python:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
